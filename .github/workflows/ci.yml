name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: enroll_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run: { working-directory: backend }
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enroll_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app tests
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }
      - run: npm audit --omit=dev --audit-level=high

  submission-e2e:
    # The engine submitting to the real portals in Chromium: wizard, drifted page, retries, lost replies, captcha.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: enroll_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enroll_test
      TEST_PORTAL_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build and start the portals and console
        working-directory: frontend
        run: |
          npm ci
          NEXT_TELEMETRY_DISABLED=1 npm run build
          PORTAL_API_KEY=dev-portal-key ENGINE_URL=http://localhost:8000 nohup npx next start -p 3100 > portal.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:3100/portals/harbour/join > /dev/null && break; sleep 1; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - name: Engine and browser
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: End-to-end submissions
        working-directory: backend
        run: pytest -q tests/test_submit_e2e.py
      - name: Start the engine for the console
        working-directory: backend
        run: |
          createdb -h localhost -U postgres enroll_console
          python - > ../ci.env <<'PY'
          from app.security.crypto import new_key
          from app.security.staff import hash_password
          print(f"ENCRYPTION_KEYS={new_key()}\nFINGERPRINT_KEY={new_key()}\nOPERATOR_TOKEN=ci-operator")
          print(f"SESSION_SECRET=ci-session\nSTAFF_ACCOUNTS=reviewer@example.com:{hash_password('ci-reviewer-pass')}")
          PY
          set -a; . ../ci.env; set +a
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/enroll_console REDIS_URL= LLM_PROVIDER=none \
            PORTAL_BASE_URL=http://localhost:3100 nohup uvicorn app.main:app --port 8000 > engine.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8000/health > /dev/null && break; sleep 1; done
        env: { PGPASSWORD: postgres }
      - name: Review console end to end
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npx playwright test -c playwright.console.config.ts
        env: { OPERATOR_TOKEN: ci-operator, CONSOLE_EMAIL: reviewer@example.com, CONSOLE_PASSWORD: ci-reviewer-pass }
