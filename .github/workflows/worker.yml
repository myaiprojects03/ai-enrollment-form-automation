name: Submission worker

# Web-form submissions need a real browser, which the serverless API does not have. The API triggers this workflow
# (repository_dispatch) when a reviewer approves a record; the schedule catches anything a trigger missed.
on:
  repository_dispatch:
    types: [submit-enrollments]
  schedule:
    - cron: "*/15 7-20 * * *"   # every 15 minutes, 07:00-20:59 UTC
    - cron: "17 2 * * *"        # nightly: also apply the retention period
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-worker    # one run at a time; a trigger during a run queues behind it
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: backend }
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      ENCRYPTION_KEYS: ${{ secrets.ENCRYPTION_KEYS }}
      FINGERPRINT_KEY: ${{ secrets.FINGERPRINT_KEY }}
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
      PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-worker.txt
      - run: python -m playwright install --with-deps chromium
      - name: Submit approved enrollments
        run: |
          PURGE=""
          if [ "${{ github.event.schedule }}" = "17 2 * * *" ]; then PURGE="--purge"; fi
          python -m scripts.worker --once --limit 25 $PURGE
