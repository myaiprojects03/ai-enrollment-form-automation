line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S105", "S106", "S311"]

[lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[lint.per-file-ignores]
"tests/*" = ["S"]

[lint.isort]
known-first-party = ["app", "tests"]
